<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Casino Vetl</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <!-- HEADER -->
    <header class="header">
        <div class="logo">🎰 Casino Vetl</div>
        <div class="user-info" id="user-info">Загрузка...</div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="content">

        <!-- Экран: Главная -->
        <section class="screen active" id="screen-home">
            <div class="card card-balance">
                <div class="balance-label">💰 Баланс</div>
                <div class="balance-value" id="balance">0 $</div>
            </div>
            <div class="row">
                <div class="card card-small">
                    <div class="small-label">🏆 Ранг</div>
                    <div class="small-value" id="rank">—</div>
                </div>
                <div class="card card-small">
                    <div class="small-label">🔥 Streak</div>
                    <div class="small-value" id="streak">0 дн.</div>
                </div>
            </div>
            <div class="card">
                <div class="small-label">📊 Оборот</div>
                <div class="small-value" id="turnover">0 $</div>
            </div>

            <div class="action-buttons">
                <button class="btn btn-gold" onclick="claimStreak()">🎁 Забрать бонус</button>
                <button class="btn btn-gold" onclick="spinWheel()">🎡 Крутить колесо</button>
                <button class="btn btn-outline" onclick="openCasino()">🎮 Играть в боте</button>
                <button class="btn btn-outline" onclick="openBank()">🏦 Открыть банк</button>
            </div>

            <div class="card" style="margin-top: 20px;">
                <h3>🎫 Промокод</h3>
                <input type="text" id="promo-input" placeholder="Введите промокод" 
                       style="width: 100%; padding: 12px; margin: 10px 0; 
                              background: #1a1508; border: 1px solid #3a2f1a; 
                              border-radius: 10px; color: #fff; font-size: 14px;
                              box-sizing: border-box;">
                <button class="btn btn-gold" onclick="activatePromo()" style="width: 100%;">Активировать</button>
            </div>
        </section>

        <!-- Экран: Квесты -->
        <section class="screen" id="screen-quests">
            <div class="card">
                <h3>🎯 Ежедневные квесты</h3>
                <div id="quests-daily">
                    <div class="empty">Открой бота, чтобы обновить</div>
                </div>
            </div>
            <div class="card">
                <h3>📆 Недельные квесты</h3>
                <div id="quests-weekly">
                    <div class="empty">Открой бота, чтобы обновить</div>
                </div>
            </div>
        </section>

        <!-- Экран: Кейсы -->
        <section class="screen" id="screen-cases">
            <div class="card">
                <h3>🎁 Кейсы</h3>
                <button class="btn btn-outline" onclick="openCase('Бронзовый')" style="width: 100%; margin: 6px 0;">🎁 Бронзовый — 25,000 $</button>
                <button class="btn btn-outline" onclick="openCase('Серебряный')" style="width: 100%; margin: 6px 0;">🎁 Серебряный — 100,000 $</button>
                <button class="btn btn-outline" onclick="openCase('Золотой')" style="width: 100%; margin: 6px 0;">🎁 Золотой — 500,000 $</button>
                <button class="btn btn-outline" onclick="openCase('Алмазный')" style="width: 100%; margin: 6px 0;">🎁 Алмазный — 2,000,000 $</button>
                <button class="btn btn-outline" onclick="openCase('Легендарный')" style="width: 100%; margin: 6px 0;">🎁 Легендарный — 10,000,000 $</button>
                <button class="btn btn-outline" onclick="openCase('Vetl Case')" style="width: 100%; margin: 6px 0;">🎁 Vetl Case — 50,000,000 $</button>
            </div>
        </section>

        <!-- Экран: Банк -->
        <section class="screen" id="screen-bank">
            <div class="card">
                <h3>🏦 Банк</h3>
                <div class="note">Вклады от 10,000 $ под 1%/час</div>
                <button class="btn btn-gold" onclick="createDeposit(50000)" style="width: 100%; margin: 8px 0;">💵 Вложить 50,000 $</button>
                <button class="btn btn-gold" onclick="createDeposit(500000)" style="width: 100%; margin: 8px 0;">💵 Вложить 500,000 $</button>
                <button class="btn btn-outline" onclick="openBank()" style="width: 100%; margin: 8px 0;">🏦 Открыть @BankVetlBot</button>
            </div>
        </section>

        <!-- Экран: Админка -->
        <section class="screen" id="screen-admin">
            <div class="card">
                <h3>👑 Админ-панель</h3>
                <button class="btn btn-outline" onclick="adminBroadcast()" style="width: 100%; margin: 6px 0;">📢 Рассылка</button>
                <button class="btn btn-outline" onclick="adminGive()" style="width: 100%; margin: 6px 0;">💰 Выдать баланс</button>
                <button class="btn btn-outline" onclick="adminTake()" style="width: 100%; margin: 6px 0;">➖ Списать баланс</button>
                <button class="btn btn-outline" onclick="adminBan()" style="width: 100%; margin: 6px 0;">🚫 Бан / Разбан</button>
                <button class="btn btn-outline" onclick="adminReset()" style="width: 100%; margin: 6px 0;">🗑 Обнулить баланс</button>
                <button class="btn btn-outline" onclick="adminRank()" style="width: 100%; margin: 6px 0;">🏆 Выдать ранг</button>
                <button class="btn btn-outline" onclick="adminRankTake()" style="width: 100%; margin: 6px 0;">🔻 Забрать ранг</button>
                <button class="btn btn-outline" onclick="adminVip()" style="width: 100%; margin: 6px 0;">👑 Выдать VIP</button>
                <button class="btn btn-outline" onclick="adminMsg()" style="width: 100%; margin: 6px 0;">📨 Написать юзеру</button>
                <button class="btn btn-outline" onclick="adminMaintenance()" style="width: 100%; margin: 6px 0;">🔧 Тех.работы</button>
                <button class="btn btn-outline" onclick="adminPromoNew()" style="width: 100%; margin: 6px 0;">🎫 Создать промо</button>
                <button class="btn btn-outline" onclick="adminPromoDel()" style="width: 100%; margin: 6px 0;">🗑 Удалить промо</button>
            </div>
        </section>

    </main>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
        <button class="nav-btn active" data-screen="home" onclick="switchScreen('home')">
            <span class="nav-icon">🏠</span>
            <span class="nav-label">Главная</span>
        </button>
        <button class="nav-btn" data-screen="quests" onclick="switchScreen('quests')">
            <span class="nav-icon">🎯</span>
            <span class="nav-label">Квесты</span>
        </button>
        <button class="nav-btn" data-screen="cases" onclick="switchScreen('cases')">
            <span class="nav-icon">🎁</span>
            <span class="nav-label">Кейсы</span>
        </button>
        <button class="nav-btn" data-screen="bank" onclick="switchScreen('bank')">
            <span class="nav-icon">🏦</span>
            <span class="nav-label">Банк</span>
        </button>
        <button class="nav-btn" id="nav-admin" data-screen="admin" onclick="switchScreen('admin')" style="display: none;">
            <span class="nav-icon">👑</span>
            <span class="nav-label">Админ</span>
        </button>
    </nav>

    <script src="app.js"></script>
</body>
</html>
